# ─────────────────────────────────────────────────────────────────────────────
# CI/CD - FutureKawa Frontend
#
# Pipeline: build ──► test ──┬──► e2e ──► sonar ──┐
#                            └──► docker ─────────┴──► deploy (main only)
#
# The Docker image is pushed to Docker Hub from main only.
#
# GitLab CI equivalences → GitHub Actions:
#   stages                    → jobs with needs: to enforce order
#   parallel jobs             → jobs with the same needs: (run in parallel)
#   image: sonarsource/...    → docker run in the step (Windows runner)
#   tags: [local]             → runs-on: self-hosted (sonar only)
#   artifacts: paths:         → actions/upload-artifact + download-artifact
#   artifacts: when: always   → if: always() on upload steps
#   allow_failure: false      → default behavior (no continue-on-error)
#   $CI_COMMIT_REF_SLUG       → ${{ github.ref_name }}
#   $CI_PIPELINE_SOURCE       → ${{ github.event_name }}
#   environment: production   → environment: production
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD - FutureKawa Frontend

# ─── Triggers ─────────────────────────────────────────────────────────────────
# GitLab: rules: if $CI_COMMIT_BRANCH == 'main'/'develop'
#              + if $CI_PIPELINE_SOURCE == 'merge_request_event'
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── JOB 1 : BUILD ─────────────────────────────────────────────────────────────
  # GitLab: stage: build → build-job
  # build-only = vite build without vue-tsc (avoids blocking TS errors)
  # The dist/ folder is passed to later jobs via artifact
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm packages installation
        run: npm ci

      - name: Build Vite
        run: npm run build-only

      - name: Build upload (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 1


  # ── JOB 2 : UNIT TESTS ───────────────────────────────────────────────────────
  # GitLab: stage: test → unit-test-job
  # Runs after the build job
  # continue-on-error on the vitest step: generates coverage/lcov.info even if
  # tests fail. The actual blocking decision is delegated to the SonarQube Quality Gate.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm packages installation
        run: npm ci

      - name: Unit tests & coverage
        run: npm run test:unit -- --coverage --reporter=verbose
        continue-on-error: true
        env:
          CI: true

      - name: Uploading coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 1


  # ── JOB 3 : E2E TESTS ────────────────────────────────────────────────────────
  # GitLab: stage: test → e2e-job
  # Runs after unit tests pass (needs: test).
  # Uses VITE_MOCK=true via dev:e2e - no real backend required.
  # Chromium only (playwright.config.ts: projects: [chromium]).
  # Reports uploaded even on failure for debugging.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm packages installation
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7


  # ── JOB 4 : SONARQUBE ANALYSIS ────────────────────────────────────────────────
  # GitLab: stage: sonar → build-sonar (tags: [local])
  # Waits for test to finish.
  # Self-hosted runner required: SonarQube runs on localhost:9000.
  # Scanner via official Docker image (no CLI installation needed on the runner).
  # host.docker.internal: from a Docker container on Windows, points to the host machine localhost → reaches SonarQube on :9000.
  # sonar.qualitygate.wait=true (sonar-project.properties): scanner waits for the result and returns exit code 1 if the Quality Gate fails.
  # JSON reports are uploaded even on failure (if: always()).
  # GitLab: artifacts: when: always
  # ─────────────────────────────────────────────────────────────────────────────
  sonar:
    name: SonarQube Analysis
    runs-on: self-hosted
    needs: [e2e]
    # Opt-in: only runs when a self-hosted runner is registered and the repository
    # variable SONAR_ENABLED is 'true' (Settings > Secrets and variables > Actions > Variables).
    # Otherwise the job is skipped instead of staying queued forever.
    if: ${{ vars.SONAR_ENABLED == 'true' && always() && !cancelled() }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Downloading coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/

      # The token goes through env (masked in logs) instead of the command line
      - name: SonarQube Analysis & Quality Gates
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm ^
            -e SONAR_TOKEN ^
            -e SONAR_HOST_URL=http://host.docker.internal:9000 ^
            -v "%GITHUB_WORKSPACE%:/usr/src" ^
            sonarsource/sonar-scanner-cli:latest

      - name: Downloading Quality Gates report
        if: always()
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          curl -s
          -u "%SONAR_TOKEN%:"
          "http://localhost:9000/api/qualitygates/project_status?projectKey=futurekawa-frontend"
          -o sonar-report.json

      - name: Downloading SonarQube issues
        if: always()
        shell: cmd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          curl -s
          -u "%SONAR_TOKEN%:"
          "http://localhost:9000/api/issues/search?projectKeys=futurekawa-frontend"
          -o sonar-issues.json

      - name: Uploading SonarQube reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # GitLab : artifacts: name: "sonar-reports-${CI_COMMIT_REF_SLUG}"
          name: sonar-reports-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            sonar-report.json
            sonar-issues.json
          retention-days: 7


  # ── JOB 5 : DEPLOY ───────────────────────────────────────────────────────────
  # GitLab: stage: deploy → deploy-job (environment: production)
  # Triggered only on push to main (not develop, not PRs), once SonarQube has
  # passed and the Docker image has been pushed.
  # GitLab equivalent:
  #   rules:
  #     - if: $CI_COMMIT_BRANCH == 'main'
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [sonar, docker]
    if: ${{ always() && github.ref_name == 'main' && github.event_name == 'push' && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') && needs.docker.result == 'success' }}
    environment: production

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Uploading build
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/

      - name: App Deployement
        run: echo "Application successfully deployed"

  # ── JOB 6 : DOCKER IMAGE ─────────────────────────────────────────────────────
  # Builds the image from the Dockerfile (multi-stage: vite build + nginx).
  # Pull requests and develop only build the image (validates the Dockerfile);
  # the push to Docker Hub happens only on main so that `latest` is always the
  # production version. Each push is also tagged with the commit sha.
  # Required secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [build, test]
    env:
      IMAGE: selimdrici/front-mspr-2
      PUSH: ${{ github.ref_name == 'main' && github.event_name == 'push' }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
